upstream database_mcp_upstream {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name database.example.com;

    ssl_certificate /etc/letsencrypt/live/database.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/database.example.com/privkey.pem;

    client_max_body_size 10m;

    location = /internal/auth/verify {
        internal;
        proxy_pass http://auth-gateway/verify;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        auth_request /internal/auth/verify;
        auth_request_set $authenticated_user $upstream_http_x_authenticated_user;

        proxy_pass http://database_mcp_upstream/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Authenticated-User $authenticated_user;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://database_mcp_upstream/health;
        proxy_http_version 1.1;
    }
}