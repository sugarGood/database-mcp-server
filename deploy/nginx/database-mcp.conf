upstream database_mcp_upstream {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name database.example.com;

    ssl_certificate /etc/letsencrypt/live/database.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/database.example.com/privkey.pem;

    client_max_body_size 10m;

    location /health {
        proxy_pass http://database_mcp_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        proxy_pass http://database_mcp_upstream/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }
}